server.port=${PORT:8080}
spring.application.name=incident-tracker
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Persistent H2 Database (saved permanently to ./data/safetydb)
spring.datasource.url=jdbc:h2:file:./data/safetydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Cloudinary Configuration (Cloud photo hosting)
# You can provide these directly here or via environment variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:ds20dwlrs}

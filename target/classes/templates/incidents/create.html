<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Report Safety Incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="card-title mb-0">Report Safety Incident</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/incidents}" th:object="${incident}" method="post">
                        
                        <div class="mb-3">
                            <label for="title" class="form-label">Incident Title</label>
                            <input type="text" id="title" th:field="*{title}" class="form-label form-control" required placeholder="e.g., Oil spill on floor">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4" required placeholder="Describe the incident in detail, including hazard details..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="location" class="form-label">Location / Area</label>
                                <input type="text" id="location" th:field="*{location}" class="form-control" required placeholder="e.g., Assembly Line B">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="severity" class="form-label">Severity Level</label>
                                <select id="severity" th:field="*{severity}" class="form-select" required>
                                    <option value="" disabled selected>Select severity...</option>
                                    <option th:each="sev : ${severities}" th:value="${sev}" th:text="${sev}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="reportedBy" class="form-label">Reported By (Your Name/ID)</label>
                            <input type="text" id="reportedBy" th:field="*{reportedBy}" class="form-control" required placeholder="e.g., Worker #405">
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/incidents}" class="btn btn-secondary">Cancel & View List</a>
                            <button type="submit" id="submit" class="btn btn-danger">Submit Incident Report</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

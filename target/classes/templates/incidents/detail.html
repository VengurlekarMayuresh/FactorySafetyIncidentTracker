<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incident Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="mb-3">
                <a th:href="@{/incidents}" class="btn btn-outline-secondary">&larr; Back to List</a>
            </div>

            <div class="card shadow">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">Incident #<span th:text="${incident.id}">123</span></h3>
                    <span th:classappend="${incident.status.name() == 'OPEN' ? 'badge bg-primary' : (incident.status.name() == 'IN_PROGRESS' ? 'badge bg-warning text-dark' : 'badge bg-success')}"
                          th:text="${incident.status}">OPEN</span>
                </div>
                <div class="card-body">
                    <h4 class="card-title text-danger mb-4" th:text="${incident.title}">Chemical Spill</h4>

                    <div class="row mb-3">
                        <div class="col-sm-3 fw-bold">Description:</div>
                        <div class="col-sm-9" th:text="${incident.description}">Detailed description goes here.</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-3 fw-bold">Location:</div>
                        <div class="col-sm-9" th:text="${incident.location}">Assembly Line A</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-3 fw-bold">Severity:</div>
                        <div class="col-sm-9">
                            <span th:classappend="${incident.severity.name() == 'HIGH' ? 'badge bg-danger' : (incident.severity.name() == 'MEDIUM' ? 'badge bg-warning text-dark' : 'badge bg-info text-dark')}"
                                  th:text="${incident.severity}">HIGH</span>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-3 fw-bold">Reported By:</div>
                        <div class="col-sm-9" th:text="${incident.reportedBy}">Worker #102</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-3 fw-bold">Reported At:</div>
                        <div class="col-sm-9" th:text="${#temporals.format(incident.reportedAt, 'yyyy-MM-dd HH:mm:ss')}">2026-08-25 00:00:00</div>
                    </div>

                    <div class="row mb-3" th:if="${incident.resolvedAt != null}">
                        <div class="col-sm-3 fw-bold">Resolved At:</div>
                        <div class="col-sm-9" th:text="${#temporals.format(incident.resolvedAt, 'yyyy-MM-dd HH:mm:ss')}">2026-08-25 00:00:00</div>
                    </div>

                    <hr>

                    <!-- Update Status -->
                    <form th:action="@{/incidents/{id}/status(id=${incident.id})}" method="post" class="row g-3 align-items-center mt-3">
                        <div class="col-auto">
                            <label for="updateStatus" class="form-label mb-0 fw-bold">Update Status:</label>
                        </div>
                        <div class="col-auto">
                            <select id="updateStatus" name="status" class="form-select form-select-sm">
                                <option th:each="st : ${statuses}" 
                                        th:value="${st}" 
                                        th:text="${st}" 
                                        th:selected="${st == incident.status}"></option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-sm btn-dark">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Safety Incidents List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Factory Safety Incidents</h2>
        <a th:href="@{/incidents/new}" class="btn btn-danger">+ Log New Incident</a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Location</th>
                            <th>Severity</th>
                            <th>Status</th>
                            <th>Reported By</th>
                            <th>Reported At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(incidents)}">
                            <td colspan="8" class="text-center text-muted py-4">No safety incidents reported yet.</td>
                        </tr>
                        <tr th:each="incident : ${incidents}">
                            <td th:text="${incident.id}">1</td>
                            <td th:text="${incident.title}" class="fw-semibold">Oil spill</td>
                            <td th:text="${incident.location}">Assembly Line A</td>
                            <td>
                                <span th:classappend="${incident.severity.name() == 'HIGH' ? 'badge bg-danger' : (incident.severity.name() == 'MEDIUM' ? 'badge bg-warning text-dark' : 'badge bg-info text-dark')}"
                                      th:text="${incident.severity}">MEDIUM</span>
                            </td>
                            <td>
                                <span th:classappend="${incident.status.name() == 'OPEN' ? 'badge bg-primary' : (incident.status.name() == 'IN_PROGRESS' ? 'badge bg-warning text-dark' : 'badge bg-success')}"
                                      th:text="${incident.status}">OPEN</span>
                            </td>
                            <td th:text="${incident.reportedBy}">Worker #102</td>
                            <td th:text="${#temporals.format(incident.reportedAt, 'yyyy-MM-dd HH:mm')}">2026-08-25 00:00</td>
                            <td>
                                <a th:href="@{/incidents/{id}(id=${incident.id})}" class="btn btn-sm btn-outline-dark">View Details</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>

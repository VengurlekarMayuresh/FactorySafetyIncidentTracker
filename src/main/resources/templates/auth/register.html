<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration - Factory Safety Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-container p-3 p-sm-4">
    <div class="row g-0 auth-card shadow-lg mx-auto" style="max-width: 540px;">
        <div class="p-4 p-sm-5 bg-white w-100 rounded-3">
            <div class="text-center mb-4">
                <div class="brand-icon-box mx-auto mb-3" style="width: 52px; height: 52px; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white;">
                    <i class="fa-solid fa-user-plus fa-lg"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Worker Account Registration</h3>
                <p class="text-muted small">Register as a factory worker to log workplace hazards and track remediation</p>
                <span class="badge bg-primary-subtle text-primary px-3 py-1">Worker / Employee Access</span>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small d-flex align-items-center mb-3">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <span th:text="${errorMessage}">Error occurred</span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3 text-start">
                    <label for="fullName" class="form-label fw-semibold text-dark small">
                        <i class="fa-regular fa-id-badge me-1 text-primary"></i> Full Name
                    </label>
                    <input type="text" class="form-control form-control-lg" id="fullName" name="fullName" placeholder="e.g. Ramesh Patil" required>
                </div>

                <div class="mb-3 text-start">
                    <label for="username" class="form-label fw-semibold text-dark small">
                        <i class="fa-regular fa-user me-1 text-primary"></i> Username or Worker ID
                    </label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Choose a unique username..." required autocomplete="username">
                </div>

                <div class="mb-3 text-start">
                    <label for="department" class="form-label fw-semibold text-dark small">
                        <i class="fa-solid fa-industry me-1 text-primary"></i> Department / Factory Bay
                    </label>
                    <input type="text" class="form-control form-control-lg" id="department" name="department" placeholder="e.g. Plant Assembly Bay 2" value="Plant Operations" required>
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label fw-semibold text-dark small">
                        <i class="fa-solid fa-lock me-1 text-primary"></i> Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a secure password..." required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3">
                    <i class="fa-solid fa-check me-2"></i> Register Worker Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top small">
                <span class="text-muted">Already registered?</span>
                <a th:href="@{/login}" class="fw-bold text-decoration-none text-primary ms-1">Sign In</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>

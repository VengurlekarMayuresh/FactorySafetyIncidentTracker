spring.application.name=incident-tracker
# --- Staging profile (H2 file-based, info logging) ---
spring.h2.console.enabled=false
spring.datasource.url=jdbc:h2:file:./data/safetydb-staging
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=staging_password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
logging.level.com.factory.safety=INFO
server.port=8081

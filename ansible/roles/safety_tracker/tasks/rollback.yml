---
# ==============================================================================
# Tasks: Automated Rollback and Recovery
# Gracefully reverts the symlink to the previous stable release and verifies health
# ==============================================================================

- name: Verify that previous stable release directory exists (v{{ previous_version }})
  stat:
    path: "{{ app_releases_dir }}/v{{ previous_version }}"
  register: previous_release_stat

- name: Abort rollback if previous release does not exist
  fail:
    msg: "Rollback aborted: Target previous release directory {{ app_releases_dir }}/v{{ previous_version }} does not exist!"
  when: not previous_release_stat.stat.exists

- name: Atomically revert current symlink to previous stable release (v{{ previous_version }})
  file:
    src: "{{ app_releases_dir }}/v{{ previous_version }}"
    dest: "{{ app_current_dir }}"
    state: link
    force: yes
    owner: "{{ app_user }}"
    group: "{{ app_group }}"

- name: Restart safety-tracker systemd service with restored release
  systemd:
    name: safety-tracker
    state: restarted
    daemon_reload: yes

- name: Wait for service port {{ app_port }} to respond after rollback
  wait_for:
    port: "{{ app_port }}"
    delay: 3
    timeout: 60
    state: started

- name: Validate post-rollback health check
  uri:
    url: "{{ health_check_url }}"
    method: GET
    status_code: 200
  register: rollback_health_check
  until: rollback_health_check.status == 200
  retries: 10
  delay: 3

- name: Output Rollback Verification Audit
  debug:
    msg:
      - "Rollback Status     : SUCCESS"
      - "Active Release      : v{{ previous_version }}"
      - "Previous Release    : v{{ app_version }}"
      - "Health Check Status : HTTP {{ rollback_health_check.status }} OK"
      - "Service State       : ACTIVE & STABLE"
